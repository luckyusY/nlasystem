services:
  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      POSTGRES_DB: nla_geoai
      POSTGRES_USER: geoai
      POSTGRES_PASSWORD: local-prototype-only
    ports:
      - "5432:5432"
    volumes:
      - geoai_postgres:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./database/seeds/001_synthetic_data.sql:/docker-entrypoint-initdb.d/002_synthetic_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoai -d nla_geoai"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  geoai_postgres:
